# Running GambleBot in Docker: copy this to docker-compose.yml, make .env (from .env.example, with
# ACTIVITY_HOST=0.0.0.0), run python download_voices.py once, then: docker compose up -d --build
# The image only holds Python and the libraries; this folder is linked in at /app, so code changes need just a
# restart (docker compose restart gamblebot). Only run ONE copy of the bot per token.
x-bot: &bot
  restart: unless-stopped
  working_dir: /app
  environment:
    TZ: Europe/Amsterdam
  stop_signal: SIGINT          # the bot shuts down the same way as with Ctrl+C
  stop_grace_period: 20s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gamblebot:
    <<: *bot
    build: .
    image: bots/gamblebot
    container_name: gamblebot
    command: ["python", "bot.py"]
    volumes:
      - type: bind
        source: .
        target: /app

  # Public HTTPS address for the Activity (the bot's web server on port 8765). It's a Cloudflare quick tunnel: the
  # address changes every time this container starts, so after a restart, run "docker compose logs gamblebot-tunnel",
  # copy the new *.trycloudflare.com address and update the root URL mapping in the Developer Portal
  # (Activities -> URL Mappings). Restart only the gamblebot service to keep the address.
  gamblebot-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: gamblebot-tunnel
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://gamblebot:8765"]
    depends_on:
      - gamblebot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
