# GambleBot in Docker. Quick start (the full steps are in the README):
#
#   cp .env.example .env                                          then fill in DISCORD_TOKEN and the rest
#   docker compose up -d --build                                  build and start the bot
#   docker compose run --rm gamblebot python download_voices.py   optional: the blackjack dealer's voice (~350 MB)
#   docker compose logs -f gamblebot                              watch it start
#
# Only run ONE copy of the bot per bot token.
services:
  gamblebot:
    build: .
    image: gamblebot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # These override .env: inside the container the database and logs go to the "gamblebot-data" volume, and the
      # Activity's web server has to listen on all interfaces to be reachable from outside the container.
      DATABASE_PATH: /data/gamble.db
      LOG_DIR: /data/logs
      ACTIVITY_HOST: 0.0.0.0
      ACTIVITY_PORT: "8765"
    volumes:
      - gamblebot-data:/data            # gamble.db and logs/
      - gamblebot-voices:/app/voices    # the dealer's voice models (download_voices.py)
    ports:
      # The Activity's web server, on this machine only. Point your HTTPS tunnel or reverse proxy at it.
      - "127.0.0.1:8765:8765"
    stop_signal: SIGINT
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: a Cloudflare quick tunnel that gives the Activity a public HTTPS address without opening ports or
  # owning a domain. Start it with:  docker compose --profile tunnel up -d
  # The address changes every time this container starts: find it with "docker compose logs tunnel" and put it in
  # the Developer Portal (Activities -> URL Mappings). For a permanent address use a named Cloudflare Tunnel or
  # your own reverse proxy instead.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://gamblebot:8765"]
    depends_on:
      - gamblebot
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gamblebot-data:
  gamblebot-voices:
